[project]
name = "f1pace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastf1==3.8.3",
  "pandas==2.3.3",
  "numpy==2.4.6",
  "pyarrow==24.0.0",
  "matplotlib==3.11.0",
  "scikit-learn==1.9.0",
  "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit==1.66.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1pace = ["archive_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
